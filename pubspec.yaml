name: torah_parashot
description: Jumash por Parashá - Torá en hebreo, transliteración y español.
publish_to: 'none'
version: 1.5.0+2
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/index.html
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  min_sdk_android: 23
