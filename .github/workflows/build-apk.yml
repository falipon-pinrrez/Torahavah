name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Crear proyecto y compilar
        run: |
          set -ex
          SRC="$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP"
          flutter create --org com.jumash --project-name torah_parashot --platforms android torah_app
          rm -rf torah_app/lib torah_app/test
          cp -r "$SRC/lib" "$SRC/assets" "$SRC/pubspec.yaml" torah_app/
          cd torah_app
          G=android/app/build.gradle.kts; [ -f "$G" ] || G=android/app/build.gradle
          sed -i -E 's/minSdk( =|) *flutter\.minSdkVersion/minSdk\1 23/; s/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' "$G"
          sed -i 's/android:label="torah_parashot"/android:label="Jumash"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$SRC/Jumash-Parasha.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Jumash-Parasha-APK
          path: Jumash-Parasha.apk
      - name: Publicar versión con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Jumash por Parashá ${{ github.run_number }}
          files: Jumash-Parasha.apk
